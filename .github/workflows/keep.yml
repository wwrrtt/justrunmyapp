name: Auto Keep Task
on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 锁定 Node.js 版本
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 确认 Node 版本
        run: node --version
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖 & 浏览器
        run: |
          pip install --upgrade pip
          pip install --upgrade "camoufox[geoip]" httpx playwright
          python -m camoufox fetch
      - name: 运行自动化脚本
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python keep.py
