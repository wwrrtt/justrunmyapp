name: Auto Keep Task

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装系统依赖（Firefox 必需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libx11-xcb1 libxrandr2 libasound2 \
            libdbus-glib-1-2 libxt6 xvfb

      - name: 安装依赖 & 浏览器
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # ✅ 顺序关键：先 playwright install，再 camoufox fetch
          python -m playwright install firefox
          python -m camoufox fetch

      - name: 运行自动化脚本
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PWDEBUG: 1  # ✅ 失败时输出详细日志
        run: python keep.py

      - name: 上传调试日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ github.run_id }}
          path: |
            playwright-report/
            *.log
            camoufox/*.log
